name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Merges seconds apart must deploy one after another: overlapping runs
# copied an older compose file over a newer one on 2026-10-12.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,docker,scripts/backup.sh"
          target: "/opt/local-music"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            cd /opt/local-music

            # Pull latest image
            docker compose -f docker-compose.prod.yml pull

            # Apply Caddy changes before the app swap, so the swap runs under the new
            # proxy settings. The Caddyfile is a single-file bind mount like the crontab,
            # so Caddy only sees a replaced file once recreated; otherwise reload it in place
            if ! docker compose -f docker-compose.prod.yml exec -T caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps caddy
            else
              docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            fi

            # Migrate with the new image before swapping the app, so it restarts only
            # once (the Prisma client is generated at build time and needs no restart).
            # Fail the deploy if migrations fail, leaving the old app running. The old app
            # serves on the new schema until the swap, so drop or rename columns in a
            # later deploy than the code that stops using them.
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps -T app npx prisma migrate deploy --config prisma/prisma.config.ts

            # Swap in the new app; Caddy holds requests while it boots
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # The crontab is a single-file bind mount installed at container start, and scp
            # replaces the file, so the running cron container keeps the old schedule until recreated
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps cron

            # Clean up old images
            docker image prune -f

            # Wait for app to be healthy
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 30); do
              docker compose -f docker-compose.prod.yml exec -T app wget -qO- http://localhost:3000/api/health && break
              [ "$i" -eq 30 ] && exit 1
              sleep 2
            done

            echo "Deployment complete!"
